<div class="page-content">
    <header>
        z-bind
    </header>
    <h2>
        使用
    </h2>
    <p>
        单向绑定修改属性的值：
    </p>
    <ui-code>
        <pre tag="html">
&lt;input z-bind:value="val1" /&gt;
</pre>
    </ui-code>
    <p>
        如果希望修改标签内的文本内容，直接：
    </p>
    <ui-code>
        <pre tag="html">
&lt;div z-bind="val1"&gt;&lt;/div&gt;
</pre>
    </ui-code>
    <p>
        比如val1的值是“点击我”，解析结果就是：
    </p>
    <ui-code>
        <pre tag="html">
&lt;div&gt;点击我&lt;/div&gt;
</pre>
    </ui-code>
    <h2>
        安全说明
    </h2>
    <div class="version">
        始于 v0.5.0
    </div>
    <p>
        出于安全考虑，z-bind 不允许设置以 on 开头的事件属性（如 onclick、onload 等），因为这会通过 setAttribute 注册事件处理函数，从而可能引入 XSS 风险。事件绑定请使用 <a
            href="#/element/directive/z-on">z-on</a> 指令。
    </p>
</div>
