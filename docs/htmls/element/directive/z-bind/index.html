<div class="page-content">
    <header>
        z-bind
    </header>
    <h2>
        使用
    </h2>
    <p>
        单向绑定修改属性的值：
    </p>
    <ui-code>
        <pre tag="html">
&lt;input z-bind:value="val1" /&gt;
</pre>
    </ui-code>
    <p>
        如果希望修改标签内的文本内容，直接：
    </p>
    <ui-code>
        <pre tag="html">
&lt;div z-bind="val1"&gt;&lt;/div&gt;
</pre>
    </ui-code>
    <p>
        比如val1的值是“点击我”，解析结果就是：
    </p>
    <ui-code>
        <pre tag="html">
&lt;div&gt;点击我&lt;/div&gt;
</pre>
    </ui-code>
</div>
