    <p>
        动态组件：
    </p>
    <ui-code>
        <pre tag="html">
&lt;component z-is="currentComponent" &gt;&lt;/component&gt;
</pre>
    </ui-code>
    <p>
        currentComponent表示组件，可以是一个函数，返回一个Promise对象，组件会在Promise resolve时被加载，或者直接是一个组件对象。
